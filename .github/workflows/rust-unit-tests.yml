name: Rust Unit Tests

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: cargo test (linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libudev-dev

      - name: Run unit tests
        # --lib                 - compile only the library target (no Tauri/wry/webkit2gtk)
        # --no-default-features - skip the tauri-build feature so tauri is not compiled
        run: cargo test --lib --no-default-features

  build-tauri:
    name: cargo build Tauri binary (linux)
    # Ubuntu 20.04 ships libwebkit2gtk-4.0 2.28.x which is compatible with
    # wry 0.24.11 (used by tauri 1.7).  Ubuntu 22.04 ships 2.38+ which
    # triggers a SettingsExt compile error inside wry itself.
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libudev-dev \
            libsoup2.4-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri binary
        run: cargo build --bin rotrics-studio-app

