[package]
name = "rotrics-studio-app"
version = "0.1.0"
edition = "2021"

[features]
# The "tauri-build" feature gates the GUI layer. It is enabled by default so
# that `cargo build` / `cargo run` produce the full Tauri application.
# CI unit-tests run with --no-default-features to skip the webkit2gtk stack.
default = ["tauri-build"]
tauri-build = ["dep:tauri"]

[dependencies]
serialport = "4.2.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Von 1.4 auf ^1.7 aktualisiert
tauri = { version = "1.7", features = ["api-all"], optional = true }
